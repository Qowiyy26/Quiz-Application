services:
  - type: web
    name: quiz-application
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-application-db
          property: connectionString
      - key: Gemini__ApiKey
        sync: false
      - key: Lightcast__clientId
        sync: false
      - key: Lightcast__clientSecret
        sync: false

databases:
  - name: quiz-application-db
    plan: free
    databaseName: quiz_application
    user: quiz_application_user
