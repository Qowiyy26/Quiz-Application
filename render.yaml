services:
  - type: web
    name: quiz-application
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__QuizContext
        fromDatabase:
          name: quiz-application-db
          property: connectionString
      - key: Gemini__ApiKey
        sync: false
      - key: Lightcast__clientId
        sync: false
      - key: Lightcast__clientSecret
        sync: false
      - key: Smtp__Host
        sync: false
      - key: Smtp__Port
        value: 587
      - key: Smtp__Username
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__FromEmail
        sync: false
      - key: Smtp__FromName
        value: Q-MSTech
      - key: Smtp__EnableSsl
        value: true

databases:
  - name: quiz-application-db
    plan: free
    databaseName: quiz_application
    user: quiz_application_user
